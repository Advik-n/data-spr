[project]
name = "procurement-desk"
version = "0.1.0"
description = "Policy-driven procurement negotiation decisions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents",
    "langchain",
    "langchain-ollama",
    "langchain-openai",
    "langgraph",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
procurement = "procurement.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "procurement"
module-root = ""
